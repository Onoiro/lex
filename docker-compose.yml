services:
  lex-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      # Bound to loopback: nginx is the only entry point, the proxy must not
      # be reachable from the internet directly.
      - "127.0.0.1:8004:8004"
    env_file:
      - ./.env
    volumes:
      - lex-cache:/app/data
    restart: unless-stopped

volumes:
  lex-cache: